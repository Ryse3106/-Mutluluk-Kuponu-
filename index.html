<html lang="tr">
<head>
<meta charset="UTF-8" />

<title>Mutluluk Kuponu</title>

<style>
  :root{
    --bg:#f4f6f8;
    --panel:#ffffff;
    --primary:#1976d2;
    --danger:#e53935;
    --soft:#e3f2fd;
    --text:#1f2a37;
    --muted:#6b7280;
    --ring: rgba(25,118,210,.28);
  }

  html, body { margin:0; padding:0; }
  body{
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .panel{
    background: var(--panel);
    padding: 20px;
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 10px 25px rgba(0,0,0,.10);
  }

  h2{ margin: 0 0 10px; text-align:center; }

  .sub{
    text-align:center;
    color: var(--muted);
    margin: 0 0 14px;
    font-size: .95rem;
  }

  .field{ margin: 10px 0; }
  label{ display:block; font-weight: 700; margin: 0 0 6px; }

  select, button, .ghost-btn{
    width: 100%;
    padding: 12px 12px;
    margin: 6px 0;
    border-radius: 10px;
    font-size: 1rem;
  }

  select{
    border: 1px solid #d1d5db;
    background: #fff;
    outline: none;
  }
  select:focus{
    box-shadow: 0 0 0 4px var(--ring);
    border-color: var(--primary);
  }

  button{
    cursor:pointer;
    border:none;
    background: var(--primary);
    color:#fff;
    font-weight: 800;
  }
  button.secondary{ background: var(--danger); }
  button.ghost{
    background: transparent;
    border: 1px solid #d1d5db;
    color: var(--text);
    font-weight: 700;
  }
  button:active{ transform: translateY(1px); }

  .result{
    background: var(--soft);
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    border: 1px solid rgba(25,118,210,.18);
  }

  .result.fade{
    animation: fadeUp .35s ease;
  }
  @keyframes fadeUp{
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result h3{
    margin: 0 0 10px;
    font-size: 1.05rem;
  }

  .meta{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0 10px;
    color: var(--muted);
    font-size: .92rem;
  }
  .pill{
    background: rgba(255,255,255,.65);
    border: 1px solid rgba(0,0,0,.06);
    padding: 6px 10px;
    border-radius: 999px;
  }

  .actions{
    display:flex;
    gap: 10px;
    margin-top: 12px;
  }
  .actions button{
    flex:1;
    margin: 0;
    padding: 12px 10px;
    border-radius: 12px;
  }
  .actions button.ghost{
    background: #fff;
    color: var(--text);
    border: 1px solid #d1d5db;
    font-weight: 800;
  }

  .top-actions{
    display:flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .top-actions button{
    flex:1;
    margin:0;
    padding: 10px 10px;
    border-radius: 12px;
    font-weight: 800;
  }

  .stats{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px 0 12px;
  }
  .stat{
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(25,118,210,.08);
    border: 1px solid rgba(25,118,210,.18);
    font-size: .92rem;
    color: var(--text);
  }

  /* Emoji + konfeti */
  .emoji-box{ text-align:center; margin: 10px 0 14px; }
  .emoji-box img{
    width: min(38vw, 140px);
    transition: transform .3s ease;
    user-select:none;
  }
  .emoji-celebrate{ animation: celebrate 1s ease-in-out; }
  @keyframes celebrate{
    0%{transform:scale(1) rotate(0deg)}
    20%{transform:scale(1.15) rotate(-10deg)}
    40%{transform:scale(1.28) rotate(10deg)}
    60%{transform:scale(1.18) rotate(-6deg)}
    80%{transform:scale(1.08) rotate(6deg)}
    100%{transform:scale(1) rotate(0deg)}
  }
  #confettiCanvas{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
  }

  /* Modal */
  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    display:none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 10000;
  }
  .modal{
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden;
  }
  .modal header{
    padding: 14px 16px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    border-bottom: 1px solid #eef2f7;
    font-weight: 800;
  }
  .modal .content{
    padding: 14px 16px 16px;
    max-height: 62vh;
    overflow:auto;
  }
  .fav-item{
    padding: 12px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    margin-bottom: 10px;
    background: #fafafa;
  }
  .fav-item .row{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }
  .fav-item small{ color: var(--muted); display:block; margin-top: 6px; }
  .mini-btn{
    border: 1px solid #d1d5db;
    background: #fff;
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
    font-weight: 800;
  }
  .mini-btn:active{ transform: translateY(1px); }

  @media (max-width: 480px){
    body{ padding: 16px; }
    .panel{ padding: 20px; max-width: 94%; }
    h2{ font-size: 1.55rem; }
    select, button{ font-size: 1.05rem; padding: 14px; }
    .actions{ flex-direction: column; }
  }
</style>

<body>
<canvas id="confettiCanvas"></canvas>

<div class="panel" role="application" aria-label="Mutluluk Kuponu uygulaması">
  <div class="emoji-box">
    <img src="emoji.png" id="emoji" alt="Kutlama emojisi" />
  </div>

  <h2>❤️❤️ Mutluluk Kuponu ❤️❤️</h2>
  <p class="sub">Kupon seç, kaydet, paylaş. Küçük bir “iyi ki” üretim hattı 🧪✨</p>

  <div class="top-actions">
    <button class="ghost" id="btnFavorites" type="button" aria-label="Favorilerimi aç">⭐ Favorilerim</button>
    <button class="ghost" id="btnStats" type="button" aria-label="İstatistikleri yenile">📊 İstatistik</button>
  </div>

  <div class="stats" id="statsBar" aria-live="polite"></div>

  <div class="field">
    <label for="periodType">Dönem Tipi</label>
    <select id="periodType" aria-label="Dönem tipi seç">
      <option value="Ay">Ay</option>
      <option value="Çeyrek">Çeyrek</option>
      <option value="Yıl">Yıl</option>
    </select>
  </div>

  <div class="field">
    <label for="periodValue">Dönem Değeri</label>
    <select id="periodValue" aria-label="Dönem değeri seç"></select>
  </div>

  <button id="btnRandom" type="button" aria-label="Rastgele kupon seç">🎲 Rastgele Kuponunu Seç 🎁😊❤️</button>
  <button class="secondary" id="btnReset" type="button" aria-label="Bu dönemi sıfırla">🧹 Bu Dönemi Sıfırla</button>

  <div class="result" id="sonuc" aria-live="polite">Henüz kupon seçilmedi.</div>
</div>

<!-- Favorites Modal -->
<div class="modal-backdrop" id="favBackdrop" role="dialog" aria-modal="true" aria-label="Favoriler modalı">
  <div class="modal">
    <header>
      <span>⭐ Favoriler</span>
      <button class="mini-btn" id="closeFav" type="button" aria-label="Favorileri kapat">Kapat ✖️</button>
    </header>
    <div class="content" id="favList"></div>
  </div>
</div>

function trSlug(s){
  return (s || "")
    .toString()
    .toLowerCase()
    .replaceAll("ğ","g").replaceAll("ü","u").replaceAll("ş","s").replaceAll("ı","i").replaceAll("ö","o").replaceAll("ç","c")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/(^-|-$)/g,"");
}

// Ensure each coupon has stable unique id
function ensureIds(list){
  list.forEach(k=>{
    if(!k.id){
      k.id = `${trSlug(k.ay)}-${String(k.no).padStart(2,"0")}`;
    }
  });
}
ensureIds(kuponlar);
ensureIds(efsaneKuponlar);

function periodKey(){
  return `${periodType.value}_${periodValue.value}`;
}
function readUsed(key){
  try{ return JSON.parse(localStorage.getItem(key) || "[]"); }
  catch{ return []; }
}
function writeUsed(key, arr){
  localStorage.setItem(key, JSON.stringify(arr));
}

function getCandidateCoupons(){
  const type = periodType.value;
  const value = periodValue.value;

  if(type === "Ay"){
    return kuponlar.filter(k => k.ay === value);
  }
  if(type === "Çeyrek"){
    const months = ceyrekMap[value] || [];
    return kuponlar.filter(k => months.includes(k.ay));
  }
  // Yıl: tüm kuponlar
  return kuponlar.slice();
}

function getRemaining(list, usedIds){
  return list.filter(k => !usedIds.includes(k.id));
}

const FAV_KEY = "favorites";
function readFavorites(){
  try{ return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); } catch { return []; }
}
function writeFavorites(arr){
  localStorage.setItem(FAV_KEY, JSON.stringify(arr));
}

function isFav(id){
  return readFavorites().includes(id);
}
function toggleFav(id){
  const favs = readFavorites();
  const ix = favs.indexOf(id);
  if(ix >= 0) favs.splice(ix,1);
  else favs.push(id);
  writeFavorites(favs);
  renderStats();
}

function openFavorites(){
  const favs = readFavorites();
  const all = [...kuponlar, ...efsaneKuponlar];
  const map = new Map(all.map(k => [k.id, k]));
  favList.innerHTML = "";

  if(favs.length === 0){
    favList.innerHTML = `<div class="fav-item">Şimdilik favori yok. Bir kupon seçince ⭐ ile kaydet 😄</div>`;
  } else {
    favs
      .map(id => map.get(id))
      .filter(Boolean)
      .forEach(k=>{
        const div = document.createElement("div");
        div.className = "fav-item";
        div.innerHTML = `
          <div class="row">
            <div>
              <strong>${k.ay} • #${k.no}</strong>
              <small>${k.metin}</small>
            </div>
            <button class="mini-btn" aria-label="Favoriden kaldır">Kaldır</button>
          </div>
        `;
        div.querySelector("button").addEventListener("click", ()=>{
          toggleFav(k.id);
          openFavorites();
        });
        favList.appendChild(div);
      });
  }

  favBackdrop.style.display = "flex";
}

/* -------------------------
   STATS
------------------------- */
function computeGlobalUsedUnique(){
  const keys = Object.keys(localStorage).filter(k =>
    k.startsWith("Ay_") || k.startsWith("Çeyrek_") || k.startsWith("Yıl_")
  );
  const all = [];
  for(const k of keys){
    const arr = readUsed(k);
    if(Array.isArray(arr)) all.push(...arr);
  }
  return [...new Set(all)];
}

function renderStats(){
  const total = kuponlar.length; // yearly pool
  const globalUsed = computeGlobalUsedUnique().length;
  const favs = readFavorites().length;

  const key = periodKey();
  const usedThis = readUsed(key).length;

  statsBar.innerHTML = `
    <span class="stat">✅ Kullanılan (genel): <b>${globalUsed}</b> / ${total}</span>
    <span class="stat">🗓️ Bu seçim: <b>${usedThis}</b></span>
    <span class="stat">⭐ Favori: <b>${favs}</b></span>
  `;
}

   MAIN ACTION
------------------------- */
function rastgeleKupon(){
  const key = periodKey();
  const used = readUsed(key);

  // Decide if we try to drop an efsane coupon (3%) first
  const roll = Math.random();
  let pool = getCandidateCoupons();
  let picked = null;
  let isLegendary = false;

  if(roll < 0.03){
    const remainingLegend = getRemaining(efsaneKuponlar, used);
    if(remainingLegend.length > 0){
      picked = remainingLegend[Math.floor(Math.random() * remainingLegend.length)];
      isLegendary = true;
    }
  }

  // Normal pick if not legendary
  if(!picked){
    const remaining = getRemaining(pool, used);

    if(remaining.length === 0){
      alert("Bu dönem için kupon kalmadı 🎯");
      return;
    }
    picked = remaining[Math.floor(Math.random() * remaining.length)];
  }

  used.push(picked.id);
  writeUsed(key, used);

  renderResult(picked, isLegendary);
  celebrateEmoji(isLegendary);
  renderStats();
}

function renderResult(k, isLegendary){
  const favNow = isFav(k.id);
  const title = isLegendary ? "👑 EFSANE KUPON!" : "🎉 Seçilen Kupon";

  const shareText =
    `${title}
Ay: ${k.ay}
No: ${k.no}

${k.metin}

(Mutluluk Kuponu)`;

  // build UI
  sonuc.classList.remove("fade");
  void sonuc.offsetWidth; // restart animation
  sonuc.classList.add("fade");

  sonuc.innerHTML = `
    <h3>${title}</h3>
    <div class="meta">
      <span class="pill"><b>Ay:</b> ${k.ay}</span>
      <span class="pill"><b>No:</b> ${k.no}</span>
      <span class="pill" id="favPill">${favNow ? "⭐ Favoride" : "☆ Favoriye ekle"}</span>
    </div>
    <div style="font-size:1.02rem; line-height:1.45;"><b>Metin:</b> ${k.metin}</div>

    <div class="actions" role="group" aria-label="Kupon işlemleri">
      <button class="ghost" id="btnCopy" type="button" aria-label="Kupon metnini kopyala">📋 Kopyala</button>
      <button class="ghost" id="btnShare" type="button" aria-label="Kuponu paylaş">📤 Paylaş</button>
      <button id="btnFav" type="button" aria-label="Kuponu favoriye ekle veya çıkar">${favNow ? "⭐ Kaldır" : "⭐ Kaydet"}</button>
    </div>
  `;

  document.getElementById("btnCopy").addEventListener("click", async ()=>{
    try{
      await navigator.clipboard.writeText(shareText);
      toast("Kopyalandı ✅");
    }catch{
      // Fallback
      const ta = document.createElement("textarea");
      ta.value = shareText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("Kopyalandı ✅");
    }
  });

  document.getElementById("btnShare").addEventListener("click", async ()=>{
    try{
      if(navigator.share){
        await navigator.share({ title: "Mutluluk Kuponu", text: shareText });
      }else{
        await navigator.clipboard.writeText(shareText);
        toast("Paylaşım yoksa kopyaladım ✅");
      }
    }catch{
      // user cancelled or unsupported
      toast("Paylaşım iptal edildi 🫠");
    }
  });

  document.getElementById("btnFav").addEventListener("click", ()=>{
    toggleFav(k.id);
    // update pill/button labels live
    const nowFav = isFav(k.id);
    document.getElementById("btnFav").textContent = nowFav ? "⭐ Kaldır" : "⭐ Kaydet";
    document.getElementById("favPill").textContent = nowFav ? "⭐ Favoride" : "☆ Favoriye ekle";
    toast(nowFav ? "Favorilere eklendi ⭐" : "Favorilerden çıkarıldı ✨");
  });

  document.getElementById("favPill").addEventListener("click", ()=>{
    toggleFav(k.id);
    const nowFav = isFav(k.id);
    document.getElementById("btnFav").textContent = nowFav ? "⭐ Kaldır" : "⭐ Kaydet";
    document.getElementById("favPill").textContent = nowFav ? "⭐ Favoride" : "☆ Favoriye ekle";
    toast(nowFav ? "Favorilere eklendi ⭐" : "Favorilerden çıkarıldı ✨");
  });
}

/* -------------------------
   Confetti engine (lightweight)
------------------------- */
const c = document.getElementById("confettiCanvas");
const ctx = c.getContext("2d");
let confetti = [];
let confettiRunning = false;

function resizeConfetti(){
  c.width = window.innerWidth * devicePixelRatio;
  c.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize", resizeConfetti);
resizeConfetti();

function spawnConfetti(n=120){
  const colors = ["#1976d2","#ff7a00","#ffd54f","#66bb6a","#ef5350","#ab47bc"];
  for(let i=0;i<n;i++){
    confetti.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*window.innerHeight*0.2,
      w: 6 + Math.random()*6,
      h: 6 + Math.random()*10,
      vx: -2 + Math.random()*4,
      vy: 3 + Math.random()*5,
      r: Math.random()*Math.PI,
      vr: (-0.2 + Math.random()*0.4),
      color: colors[(Math.random()*colors.length)|0],
      life: 60 + (Math.random()*50|0)
    });
  }
}

function startConfetti(durationMs=1400, boost=false){
  spawnConfetti(boost ? 220 : 140);
  if(confettiRunning) return;
  confettiRunning = true;
  const endAt = performance.now() + durationMs;

  function frame(t){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    confetti = confetti.filter(p=>p.life>0);
    for(const p of confetti){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.r += p.vr;
      p.life -= 1;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if(t < endAt || confetti.length>0){
      requestAnimationFrame(frame);
    } else {
      confettiRunning = false;
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    }
  }
  requestAnimationFrame(frame);
}

function celebrateEmoji(boost=false){
  const emoji = document.getElementById("emoji");
  if(!emoji) return;
  emoji.classList.remove("emoji-celebrate");
  void emoji.offsetWidth;
  emoji.classList.add("emoji-celebrate");
  startConfetti(boost ? 2200 : 1600, boost);
}

/* PWA SW register */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  });
}
</script>
